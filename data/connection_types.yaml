# Connection types (facts) — spec §2.4, minus mates[] (references
# interface roles and geometry types, out of scope for Slice 1 — see
# CLAUDE.md §2 and src/cdfma/schema.py).
#
# removal_method, damage_to_self/host, re_installable, reuse_cycles,
# tolerance_absorbed, ghg_A1A3, ghg_A5, cost_install and cost_removal
# below are transcribed from the docs/mvp-scope.md worked-example
# appendix. Their DataQuality records (ghg_data/cost_data) are NOT given
# anywhere in the source docs — CLAUDE.md §5 (architecture invariant 7)
# still requires one, so these are clearly-labeled PLACEHOLDER values
# (per the user's explicit choice — see the conversation and
# docs/open-questions.md #1), not real citations.
#
# screw_fixing_metal through rivet_fixing_aluminium (below
# mechanical_bracket) are a demo dataset, entirely illustrative — see
# docs/open-questions.md #9.

