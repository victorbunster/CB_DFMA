[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdfma"
version = "0.1.0"
description = "Circular DfMA MVP — deterministic, rule-driven decision-support engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cdfma = "cdfma.cli:main"
cdfma-gui = "cdfma.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
